name: Deploy Kubertnetes a LAMP stack on Local Machine

on:
  #push:
  workflow_dispatch: 
    branches:
      - main  # Trigger on push to main branch

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Executes directly on your local Linux machine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull updated Docker images (optional)
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          run: docker compose pull

      - name: Setup
        run: sh setup.sh
        
      - name: Deploy Docker Compose
        run: docker compose --remove-orphans

      - name: Verify Kubernetes Cluster Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy LAMP stack cluster
        run: |
          kubectl apply -f k8s_lampstack_deploy.yaml

      - name: Check Deployment Status
        run: |
          kubectl rollout status deployment/mysql
          kubectl rollout status deployment/apache-php
          kubectl get svc
